<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative light ring -->
  <circle cx="256" cy="256" r="190" stroke="rgba(255,255,255,0.08)" stroke-width="2" fill="none"/>
  
  <!-- Main Symbol: Elegant Stylized Comma & Academic Mortarboard -->
  <g filter="url(#glow)">
    <!-- Comma Head Circle -->
    <circle cx="256" cy="220" r="88" fill="#ffffff"/>
    <!-- Comma Tail -->
    <path d="M 256,308 C 256,370 206,420 162,420 C 188,400 216,365 216,308 Z" fill="#ffffff"/>
    
    <!-- Academic Cap Accent On Top -->
    <path d="M 256 120 L 370 176 L 256 232 L 142 176 Z" fill="url(#accentGrad)"/>
    <!-- Cap Base & Tassel -->
    <path d="M 200 205 L 200 240 C 200 262 312 262 312 240 L 312 205 Z" fill="#1e40af" opacity="0.9"/>
    <circle cx="256" cy="176" r="7" fill="#ffffff"/>
    <!-- Tassel String -->
    <path d="M 256 176 Q 345 200 355 260" stroke="#fef08a" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="355" cy="265" r="7" fill="#facc15"/>
  </g>
  
  <!-- Text Label Badge -->
  <text x="256" y="470" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="rgba(255,255,255,0.85)" letter-spacing="2">COMMA EDU</text>
</svg>
